name: Freetz-NG Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Speicherplatz freigeben
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Pakete installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion git bc bison flex gcc g++ make libncurses5-dev libncursesw5-dev zlib1g-dev libacl1-dev libcap-dev intltool libglib2.0-dev libtool-bin libxml-parser-perl automake autoconf pkg-config unzip bzip2 xz-utils wget curl python3 libssl-dev libelf-dev rsync cpio file patch

      - name: Konfiguration pruefen
        run: |
          if [ ! -f .config ]; then
            echo "FEHLER: .config fehlt im Hauptverzeichnis!"
            exit 1
          fi
          make olddefconfig

      - name: Image bauen
        run: make -j$(nproc)

      - name: Image hochladen
        uses: actions/upload-artifact@v4
        with:
          name: freetz-ng-firmware
          path: images/*
          retention-days: 7
