name: Freetz-NG Multi-Build

on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - modell: "7690"
            typ: "FREETZ_TYPE_7690"
            platz_sparen: "nein"
          - modell: "7590ax"
            typ: "FREETZ_TYPE_7590_W6"
            platz_sparen: "ja"
          - modell: "7590"
            typ: "FREETZ_TYPE_7590_W5"
            platz_sparen: "ja"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Maximalen Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Download-Cache laden
        uses: actions/cache@v4
        with:
          path: dl
          key: freetz-dl-${{ hashFiles('config.base') }}
          restore-keys: |
            freetz-dl-

      - name: Defekten uClibc-Locale-Download vorab beheben
        run: |
          DL_DIR=$(readlink -f dl || echo "dl")
          mkdir -p "$DL_DIR"
          rm -f "$DL_DIR/uClibc-locale-030818.tgz"
          curl -fL --insecure -o "$DL_DIR/uClibc-locale-030818.tgz" https://buildroot.net || \
          curl -fL --insecure --ciphers DEFAULT:@SECLEVEL=1 -o "$DL_DIR/uClibc-locale-030818.tgz" https://uclibc.org || \
          curl -fL --insecure -o "$DL_DIR/uClibc-locale-030818.tgz" https://gentoo.org || \
          rm -f "$DL_DIR/uClibc-locale-030818.tgz"

      - name: Alle Freetz-NG Pakete installieren
        run: |
          sudo apt-get update
          sudo ./tools/prerequisites install -y

      - name: Konfiguration fuer ${{ matrix.modell }} generieren
        run: |
          if [ ! -f "config.base" ]; then
            echo "FEHLER: config.base fehlt im Hauptverzeichnis!"
            exit 1
          fi
          
          # Alle Modell-, Toolchain-, Compiler-, NLS- und External-Flags sauber entfernen
          grep -vE "^FREETZ_TYPE_7|^# FREETZ_TYPE_7|^FREETZ_TYPE_FIRMWARE_0|^# FREETZ_TYPE_FIRMWARE_0|^FREETZ_BUILD_TOOLCHAIN|^FREETZ_DOWNLOAD_TOOLCHAIN|^FREETZ_TARGET_|^FREETZ_KERNEL_|^FREETZ_SEPARATE_|^FREETZ_STDCXXLIB|^FREETZ_EXTERNAL_|^EXTERNAL_|^# EXTERNAL_|^FREETZ_HOST_|^FREETZ_DISABLE_NLS|^FREETZ_NLS|^.*CFLAGS|^.*CXXFLAGS|^.*LDFLAGS|^FREETZ_PACKAGE_GIT|^FREETZ_PACKAGE_APACHE2" config.base > .config || true
          
          # Zielmodell setzen & fertige Toolchain herunterladen
          echo "${{ matrix.typ }}=y" >> .config
          echo "FREETZ_DOWNLOAD_TOOLCHAIN=y" >> .config
          
          # Git und Apache2 deaktivieren
          echo "# FREETZ_PACKAGE_GIT is not set" >> .config
          echo "# FREETZ_PACKAGE_APACHE2 is not set" >> .config
          
          # Bei 7590 und 7590 AX Microperl, Sudo, USB-IDs und Polipo abschalten (Tor, Samba & Nagios bleiben drin!)
          if [ "${{ matrix.platz_sparen }}" = "ja" ]; then
            sed -i -E '/FREETZ_PACKAGE_(MICROPERL|SUDO|USBIDS|POLIPO)/d' .config
            echo "# FREETZ_PACKAGE_MICROPERL is not set" >> .config
            echo "# FREETZ_PACKAGE_SUDO is not set" >> .config
            echo "# FREETZ_PACKAGE_USBIDS is not set" >> .config
            echo "# FREETZ_PACKAGE_POLIPO is not set" >> .config
          fi
          
          make olddefconfig

      - name: Image fuer ${{ matrix.modell }} bauen
        run: |
          set -o pipefail
          unset CFLAGS CXXFLAGS LDFLAGS CPPFLAGS
          make ncurses-source || true
          timeout 330m bash -c 'make -j1 || make -j1' 2>&1 | tee build.log || {
            echo "::error::$(tail -n 30 build.log | tr '\n' ' ')"
            tail -n 60 build.log
            exit 1
          }

      - name: Fehler-Log bei Abbruch speichern
        if: failure() && hashFiles('build.log') != ''
        run: tail -n 150 build.log > fehler-${{ matrix.modell }}.txt

      - name: Fehler-Log hochladen
        if: failure() && hashFiles('fehler-*.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fehler-log-${{ matrix.modell }}
          path: fehler-${{ matrix.modell }}.txt
          retention-days: 3

      - name: Ergebnisse (Image) hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: freetz-ng-${{ matrix.modell }}
          path: |
            images/*.image
          retention-days: 7
