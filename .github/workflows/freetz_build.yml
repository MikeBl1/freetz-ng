name: Freetz-NG Multi-Build

on:
  push:
    branches:
      - master
  schedule:
    - cron: "15 3 */3 * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - modell: "7690"
            typ: "FREETZ_TYPE_7690"
            ext_dir: "/var/media/ftp"
            auslagern: "nein"
          - modell: "7590ax"
            typ: "FREETZ_TYPE_7590_W6"
            ext_dir: "/var/media/ftp/uStor01"
            auslagern: "ja"
          - modell: "7590"
            typ: "FREETZ_TYPE_7590_W5"
            ext_dir: "/var/media/ftp/uStor01"
            auslagern: "ja"

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Maximalen Speicherplatz freigeben
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Alle Freetz-NG Pakete installieren
        run: |
          sudo apt-get update
          sudo ./tools/prerequisites install -y

      - name: Konfiguration fuer ${{ matrix.modell }} generieren
        run: |
          if [ ! -f "config.base" ]; then
            echo "FEHLER: config.base fehlt im Hauptverzeichnis!"
            exit 1
          fi
          
          # Modell-, Firmware-, Toolchain-, Compiler- und External-Zeilen bereinigen
          grep -vE "^FREETZ_TYPE_7|^# FREETZ_TYPE_7|^FREETZ_TYPE_FIRMWARE_0|^# FREETZ_TYPE_FIRMWARE_0|^FREETZ_BUILD_TOOLCHAIN|^FREETZ_DOWNLOAD_TOOLCHAIN|^FREETZ_TARGET_|^FREETZ_KERNEL_|^FREETZ_SEPARATE_|^FREETZ_STDCXXLIB|^FREETZ_EXTERNAL_|^# EXTERNAL_ENABLED" config.base > .config
          
          # Zielmodell setzen & fertige Toolchain herunterladen
          echo "${{ matrix.typ }}=y" >> .config
          echo "FREETZ_DOWNLOAD_TOOLCHAIN=y" >> .config
          
          # Tor, Bind und Samba bleiben im Flash; nur Python, Git und Apache2 auslagern
          if [ "${{ matrix.auslagern }}" = "ja" ]; then
            echo "FREETZ_EXTERNAL_ENABLE=y" >> .config
            echo "FREETZ_EXTERNAL_DOWNLOADER=n" >> .config
            echo "FREETZ_EXTERNAL_DIRECTORY=\"${{ matrix.ext_dir }}\"" >> .config
            echo "FREETZ_EXTERNAL_FREETZ_PACKAGE_PYTHON=y" >> .config
            echo "FREETZ_EXTERNAL_FREETZ_PACKAGE_GIT=y" >> .config
            echo "FREETZ_EXTERNAL_FREETZ_PACKAGE_APACHE2=y" >> .config
          fi
          
          make olddefconfig
          grep -E "TOOLCHAIN" .config

      - name: Image fuer ${{ matrix.modell }} bauen
        run: |
          set -o pipefail
          make -j2 2>&1 | tee build.log || {
            echo "::error::$(tail -n 30 build.log | tr '\n' ' ')"
            tail -n 60 build.log
            exit 1
          }

      - name: Fehler-Log bei Abbruch speichern
        if: failure()
        run: tail -n 150 build.log > fehler-${{ matrix.modell }}.txt

      - name: Fehler-Log hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fehler-log-${{ matrix.modell }}
          path: fehler-${{ matrix.modell }}.txt
          retention-days: 3

      - name: Ergebnisse (Image + optional External) hochladen
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: freetz-ng-${{ matrix.modell }}
          path: |
            images/*.image
            images/*.external
          retention-days: 7
